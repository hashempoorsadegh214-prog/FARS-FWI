name: Update FWI Fars

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Download FWI Forecast
        run: |

          mkdir -p data

          cat > request_fwi.py <<'PY'

          import requests
          import json
          import re
          from datetime import datetime, timedelta, timezone


          # =========================================================
          # ایران
          # =========================================================

          IRAN_TZ = timezone(timedelta(hours=3, minutes=30))

          now = datetime.now(IRAN_TZ)

          target = now.date() + timedelta(days=1)

          target_date = target.strftime("%Y-%m-%d")


          # =========================================================
          # تبدیل میلادی به شمسی
          # =========================================================

          def gregorian_to_jalali(gy, gm, gd):

              g_days = [
                  31, 28, 31, 30, 31, 30,
                  31, 31, 30, 31, 30, 31
              ]

              if gy % 4 == 0 and (
                  gy % 100 != 0 or gy % 400 == 0
              ):
                  g_days[1] = 29

              gy2 = gy - 1600
              gm2 = gm - 1
              gd2 = gd - 1

              g_day_no = (
                  365 * gy2
                  + (gy2 + 3) // 4
                  - (gy2 + 99) // 100
                  + (gy2 + 399) // 400
              )

              for i in range(gm2):
                  g_day_no += g_days[i]

              g_day_no += gd2

              j_day_no = g_day_no - 79

              j_np = j_day_no // 12053

              j_day_no %= 12053

              jy = (
                  979
                  + 33 * j_np
                  + 4 * (j_day_no // 1461)
              )

              j_day_no %= 1461

              if j_day_no >= 366:

                  jy += (j_day_no - 1) // 365

                  j_day_no = (j_day_no - 1) % 365

              if j_day_no < 186:

                  jm = 1 + j_day_no // 31

                  jd = 1 + j_day_no % 31

              else:

                  jm = 7 + (j_day_no - 186) // 30

                  jd = 1 + (j_day_no - 186) % 30

              return jy, jm, jd


          jy, jm, jd = gregorian_to_jalali(
              target.year,
              target.month,
              target.day
          )

          shamsi_date = f"{jy:04d}-{jm:02d}-{jd:02d}"


          print("================================")
          print("FWI FORECAST")
          print("================================")
          print(
              "Iran current date:",
              now.strftime("%Y-%m-%d %H:%M")
          )
          print(
              "Forecast Gregorian:",
              target_date
          )
          print(
              "Forecast Shamsi:",
              shamsi_date
          )
          print("================================")


          # =========================================================
          # GWIS
          # =========================================================

          GWIS_URL = (
              "https://maps.effis.emergency.copernicus.eu/gwis"
          )

          LAYER = "ecmwf.fwi"

          WEST = 50.0
          SOUTH = 27.0
          EAST = 55.0
          NORTH = 32.0


          # =========================================================
          # دریافت تصویر FWI
          # =========================================================

          print("Requesting GWIS map...")

          map_params = {

              "SERVICE": "WMS",

              "VERSION": "1.1.1",

              "REQUEST": "GetMap",

              "LAYERS": LAYER,

              "STYLES": "",

              "SRS": "EPSG:4326",

              "BBOX": (
                  f"{WEST},{SOUTH},{EAST},{NORTH}"
              ),

              "WIDTH": "1200",

              "HEIGHT": "1200",

              "FORMAT": "image/png",

              "TRANSPARENT": "TRUE",

              "TIME": target_date
          }


          response = requests.get(
              GWIS_URL,
              params=map_params,
              timeout=120
          )


          print(
              "Map HTTP status:",
              response.status_code
          )

          print(
              "Map Content-Type:",
              response.headers.get("Content-Type")
          )


          if response.status_code != 200:

              raise RuntimeError(
                  "GWIS map request failed."
              )


          content_type = response.headers.get(
              "Content-Type",
              ""
          ).lower()


          if "image/png" not in content_type:

              print(response.text[:2000])

              raise RuntimeError(
                  "GWIS did not return PNG."
              )


          with open(
              "data/fwi_forecast.png",
              "wb"
          ) as f:

              f.write(response.content)


          print(
              "FWI forecast map saved."
          )


          # =========================================================
          # نقاط شبکه برای GetFeatureInfo
          #
          # این نقاط فقط برای گرفتن مقدار عددی هستند.
          # =========================================================

          grid = []

          lat = 27.0

          while lat <= 32.0:

              lon = 50.0

              while lon <= 55.0:

                  grid.append(
                      (
                          round(lon, 4),
                          round(lat, 4)
                      )
                  )

                  lon += 0.25

              lat += 0.25


          print(
              "Grid points:",
              len(grid)
          )


          # =========================================================
          # تابع دریافت FWI عددی
          # =========================================================

          def get_fwi(lon, lat):

              delta = 0.02

              bbox = (
                  f"{lon - delta},"
                  f"{lat - delta},"
                  f"{lon + delta},"
                  f"{lat + delta}"
              )


              params = {

                  "SERVICE": "WMS",

                  "VERSION": "1.1.1",

                  "REQUEST": "GetFeatureInfo",

                  "LAYERS": LAYER,

                  "QUERY_LAYERS": LAYER,

                  "STYLES": "",

                  "SRS": "EPSG:4326",

                  "BBOX": bbox,

                  "WIDTH": "101",

                  "HEIGHT": "101",

                  "X": "50",

                  "Y": "50",

                  "INFO_FORMAT": "text/plain",

                  "FEATURE_COUNT": "1",

                  "TIME": target_date
              }


              try:

                  r = requests.get(
                      GWIS_URL,
                      params=params,
                      timeout=30
                  )

                  if r.status_code != 200:
                      return None

                  text = r.text.strip()

                  if not text:
                      return None


                  # ---------------------------------------------
                  # پیدا کردن عدد FWI
                  # ---------------------------------------------

                  patterns = [

                      r"fwi[^0-9\-]*([-+]?\d+(?:\.\d+)?)",

                      r"FWI[^0-9\-]*([-+]?\d+(?:\.\d+)?)",

                      r"value[^0-9\-]*([-+]?\d+(?:\.\d+)?)"

                  ]


                  for pattern in patterns:

                      match = re.search(
                          pattern,
                          text,
                          re.IGNORECASE
                      )

                      if match:

                          value = float(
                              match.group(1)
                          )

                          if value >= 0:

                              return round(
                                  value,
                                  3
                              )


                  # اگر متن فقط یک عدد بود

                  numbers = re.findall(
                      r"[-+]?\d+(?:\.\d+)?",
                      text
                  )


                  for number in numbers:

                      value = float(number)

                      if 0 <= value <= 150:

                          return round(
                              value,
                              3
                          )


              except Exception:

                  return None


              return None


          # =========================================================
          # دریافت مقادیر
          # =========================================================

          points = []

          successful = 0


          for i, (lon, lat) in enumerate(grid):

              value = get_fwi(
                  lon,
                  lat
              )


              if value is not None:

                  points.append({

                      "lat": lat,

                      "lon": lon,

                      "fwi": value

                  })

                  successful += 1


              if (i + 1) % 20 == 0:

                  print(
                      f"Processed {i + 1}/{len(grid)}"
                  )


          print("================================")
          print("FWI NUMERIC EXTRACTION")
          print("================================")

          print(
              "Successful points:",
              successful
          )

          print(
              "Total points:",
              len(grid)
          )


          # =========================================================
          # آمار
          # =========================================================

          if points:

              values = [
                  p["fwi"]
                  for p in points
              ]

              minimum = min(values)

              maximum = max(values)

              mean = round(
                  sum(values) / len(values),
                  3
              )

          else:

              minimum = None

              maximum = None

              mean = None


          # =========================================================
          # خروجی JSON
          # =========================================================

          output = {

              "forecast_gregorian": target_date,

              "forecast_shamsi": shamsi_date,

              "generated_at_iran": now.strftime(
                  "%Y-%m-%d %H:%M"
              ),

              "source": (
                  "Copernicus GWIS / ECMWF"
              ),

              "layer": LAYER,

              "region": "Fars Province, Iran",

              "bbox": [
                  WEST,
                  SOUTH,
                  EAST,
                  NORTH
              ],

              "points": points,

              "statistics": {

                  "count": len(points),

                  "min": minimum,

                  "max": maximum,

                  "mean": mean

              },

              "image": "fwi_forecast.png"

          }


          with open(
              "data/fwi.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("================================")
          print("FWI FORECAST READY")
          print("================================")

          print(
              "Gregorian:",
              target_date
          )

          print(
              "Shamsi:",
              shamsi_date
          )

          print(
              "Values:",
              len(points)
          )

          print(
              "Minimum:",
              minimum
          )

          print(
              "Maximum:",
              maximum
          )

          print(
              "Mean:",
              mean
          )

          print("================================")

          PY

          python request_fwi.py


      - name: Show result
        run: |

          echo "================================"
          echo "FWI FORECAST RESULT"
          echo "================================"

          cat data/fwi.json

          echo "================================"


      - name: Save FWI
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fwi.json

          git add data/fwi_forecast.png

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Update FWI forecast"

            git push

          fi
