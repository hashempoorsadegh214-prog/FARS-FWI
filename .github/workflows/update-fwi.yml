name: Update FWI Fars

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests rasterio numpy geopandas shapely jdatetime

      - name: Download FWI forecast for tomorrow
        run: |
          mkdir -p data

          cat > request_fwi.py <<'PY'
          import requests
          from datetime import datetime, timedelta, timezone
          import jdatetime

          # -----------------------------------------
          # تاریخ فردا بر اساس ساعت ایران
          # -----------------------------------------

          iran_tz = timezone(timedelta(hours=3, minutes=30))

          now_iran = datetime.now(iran_tz)

          target_date = (
              now_iran.date() +
              timedelta(days=1)
          )

          shamsi = jdatetime.date.fromgregorian(
              year=target_date.year,
              month=target_date.month,
              day=target_date.day
          )

          gregorian = target_date.strftime("%Y-%m-%d")

          shamsi_text = (
              f"{shamsi.year:04d}-"
              f"{shamsi.month:02d}-"
              f"{shamsi.day:02d}"
          )

          print("================================")
          print("FWI FORECAST")
          print("================================")
          print(
              "Iran current date:",
              now_iran.strftime("%Y-%m-%d %H:%M")
          )
          print(
              "Forecast Gregorian:",
              gregorian
          )
          print(
              "Forecast Shamsi:",
              shamsi_text
          )
          print("================================")

          # -----------------------------------------
          # GWIS WMS
          # -----------------------------------------

          url = (
              "https://maps.effis.emergency.copernicus.eu/gwis"
          )

          params = {
              "SERVICE": "WMS",
              "VERSION": "1.1.1",
              "REQUEST": "GetMap",
              "LAYERS": "ecmwf.fwi",
              "STYLES": "",
              "FORMAT": "image/geotiff",
              "TRANSPARENT": "TRUE",
              "SRS": "EPSG:4326",

              # فارس و اطراف آن
              "BBOX": "50,27,55.8,32",

              # وضوح مناسب برای استخراج داده
              "WIDTH": "580",
              "HEIGHT": "500",

              # فردا
              "TIME": gregorian
          }

          print("Requesting GWIS...")
          print("Layer:", params["LAYERS"])
          print("Time:", params["TIME"])

          response = requests.get(
              url,
              params=params,
              timeout=180
          )

          print(
              "HTTP status:",
              response.status_code
          )

          print(
              "Content-Type:",
              response.headers.get(
                  "content-type",
                  ""
              )
          )

          if response.status_code != 200:
              print(response.text[:2000])
              raise RuntimeError(
                  "GWIS WMS request failed."
              )

          content_type = response.headers.get(
              "content-type",
              ""
          ).lower()

          if (
              "image" not in content_type
              and
              "tiff" not in content_type
          ):
              print(response.text[:2000])
              raise RuntimeError(
                  "GWIS did not return a GeoTIFF."
              )

          with open(
              "data/fwi_forecast.tif",
              "wb"
          ) as f:
              f.write(response.content)

          # تاریخ برای مرحله بعد
          with open(
              "data/fwi_date.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  gregorian +
                  "|" +
                  shamsi_text
              )

          print(
              "Saved:",
              "data/fwi_forecast.tif"
          )
          PY

          python request_fwi.py

      - name: Extract FWI for Fars
        run: |
          cat > extract_fwi.py <<'PY'
          import json
          import numpy as np
          import rasterio
          import geopandas as gpd
          from shapely.geometry import Point

          RASTER_FILE = "data/fwi_forecast.tif"
          BOUNDARY_FILE = "fars.geojson"
          OUTPUT_FILE = "data/fwi_fars.json"

          # -----------------------------------------
          # تاریخ
          # -----------------------------------------

          with open(
              "data/fwi_date.txt",
              "r",
              encoding="utf-8"
          ) as f:
              gregorian_date, shamsi_date = (
                  f.read().strip().split("|")
              )

          print("================================")
          print("READING FWI FORECAST")
          print("================================")

          # -----------------------------------------
          # خواندن Raster
          # -----------------------------------------

          with rasterio.open(
              RASTER_FILE
          ) as src:

              print(
                  "Raster CRS:",
                  src.crs
              )

              print(
                  "Raster size:",
                  src.width,
                  "x",
                  src.height
              )

              print(
                  "Raster dtype:",
                  src.dtypes[0]
              )

              data = src.read(1)

              transform = src.transform

              nodata = src.nodata

              print(
                  "NoData:",
                  nodata
              )

              # -------------------------------------
              # مرز فارس
              # -------------------------------------

              fars = gpd.read_file(
                  BOUNDARY_FILE
              )

              if fars.crs is None:
                  fars = fars.set_crs(
                      "EPSG:4326"
                  )
              else:
                  fars = fars.to_crs(
                      "EPSG:4326"
                  )

              geometry = (
                  fars.geometry.union_all()
              )

              points = []

              # -------------------------------------
              # استخراج مرکز سلول‌های Raster
              # -------------------------------------

              for row in range(
                  src.height
              ):

                  for col in range(
                      src.width
                  ):

                      value = data[
                          row,
                          col
                      ]

                      if not np.isfinite(
                          value
                      ):
                          continue

                      if (
                          nodata is not None
                          and
                          value == nodata
                      ):
                          continue

                      lon, lat = (
                          rasterio.transform.xy(
                              transform,
                              row,
                              col,
                              offset="center"
                          )
                      )

                      point = Point(
                          float(lon),
                          float(lat)
                      )

                      if geometry.contains(
                          point
                      ):

                          points.append({
                              "lat": round(
                                  float(lat),
                                  6
                              ),
                              "lon": round(
                                  float(lon),
                                  6
                              ),
                              "fwi": round(
                                  float(value),
                                  3
                              )
                          })

          # -----------------------------------------
          # خروجی
          # -----------------------------------------

          output = {
              "date": gregorian_date,
              "date_shamsi": shamsi_date,
              "variable": "fwi",
              "source":
                  "Copernicus GWIS / ECMWF Fire Danger Forecast",
              "region":
                  "Fars Province, Iran",
              "forecast":
                  "tomorrow",
              "points": points
          }

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("FWI FARS RESULT")
          print("================================")

          print(
              "Forecast Gregorian:",
              gregorian_date
          )

          print(
              "Forecast Shamsi:",
              shamsi_date
          )

          print(
              "Number of values:",
              len(points)
          )

          if points:

              values = [
                  p["fwi"]
                  for p in points
              ]

              print(
                  "Minimum FWI:",
                  round(min(values), 3)
              )

              print(
                  "Maximum FWI:",
                  round(max(values), 3)
              )

              print(
                  "Mean FWI:",
                  round(
                      sum(values) /
                      len(values),
                      3
                  )
              )

          print(
              "Output:",
              OUTPUT_FILE
          )

          print("================================")
          PY

          python extract_fwi.py

      - name: Show result
        run: |
          echo "========== FWI FARS =========="
          cat data/fwi_fars.json
          echo "=============================="

      - name: Save FWI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fwi_fars.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update FWI forecast for tomorrow"
            git push
          fi
