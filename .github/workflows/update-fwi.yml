name: Update FWI Fars

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Get FWI Forecast
        run: |

          mkdir -p data

          cat > request_fwi.py <<'PY'
          import requests
          import json
          import re
          from datetime import datetime, timedelta, timezone


          # =====================================================
          # زمان ایران
          # =====================================================

          IRAN_TZ = timezone(timedelta(hours=3, minutes=30))

          now = datetime.now(IRAN_TZ)

          target = now.date() + timedelta(days=1)

          target_date = target.strftime("%Y-%m-%d")


          # =====================================================
          # میلادی به شمسی
          # =====================================================

          def gregorian_to_jalali(gy, gm, gd):

              g_days = [
                  31, 28, 31, 30, 31, 30,
                  31, 31, 30, 31, 30, 31
              ]

              if gy % 4 == 0 and (
                  gy % 100 != 0 or gy % 400 == 0
              ):
                  g_days[1] = 29

              gy2 = gy - 1600
              gm2 = gm - 1
              gd2 = gd - 1

              g_day_no = (
                  365 * gy2
                  + (gy2 + 3) // 4
                  - (gy2 + 99) // 100
                  + (gy2 + 399) // 400
              )

              for i in range(gm2):
                  g_day_no += g_days[i]

              g_day_no += gd2

              j_day_no = g_day_no - 79

              j_np = j_day_no // 12053

              j_day_no %= 12053

              jy = (
                  979
                  + 33 * j_np
                  + 4 * (j_day_no // 1461)
              )

              j_day_no %= 1461

              if j_day_no >= 366:

                  jy += (j_day_no - 1) // 365

                  j_day_no = (j_day_no - 1) % 365

              if j_day_no < 186:

                  jm = 1 + j_day_no // 31

                  jd = 1 + j_day_no % 31

              else:

                  jm = 7 + (j_day_no - 186) // 30

                  jd = 1 + (j_day_no - 186) % 30

              return jy, jm, jd


          jy, jm, jd = gregorian_to_jalali(
              target.year,
              target.month,
              target.day
          )

          shamsi_date = f"{jy:04d}-{jm:02d}-{jd:02d}"


          print("================================")
          print("FWI FORECAST")
          print("================================")
          print(
              "Iran current date:",
              now.strftime("%Y-%m-%d %H:%M")
          )
          print(
              "Forecast Gregorian:",
              target_date
          )
          print(
              "Forecast Shamsi:",
              shamsi_date
          )
          print("================================")


          # =====================================================
          # GWIS
          # =====================================================

          GWIS_URL = (
              "https://maps.effis.emergency.copernicus.eu/gwis"
          )

          LAYER = "ecmwf.fwi"

          WEST = 50.0
          SOUTH = 27.0
          EAST = 55.0
          NORTH = 32.0


          # =====================================================
          # تصویر FWI فردا
          # =====================================================

          print("Requesting GWIS map...")

          map_params = {
              "SERVICE": "WMS",
              "VERSION": "1.1.1",
              "REQUEST": "GetMap",
              "LAYERS": LAYER,
              "STYLES": "",
              "SRS": "EPSG:4326",
              "BBOX": (
                  f"{WEST},{SOUTH},{EAST},{NORTH}"
              ),
              "WIDTH": "1000",
              "HEIGHT": "1000",
              "FORMAT": "image/png",
              "TRANSPARENT": "TRUE",
              "TIME": target_date
          }

          response = requests.get(
              GWIS_URL,
              params=map_params,
              timeout=120
          )

          print(
              "HTTP status:",
              response.status_code
          )

          print(
              "Content-Type:",
              response.headers.get("Content-Type")
          )

          if response.status_code != 200:
              raise RuntimeError(
                  "GWIS map request failed."
              )

          content_type = response.headers.get(
              "Content-Type",
              ""
          ).lower()

          if "image/png" not in content_type:

              print(response.text[:2000])

              raise RuntimeError(
                  "GWIS did not return PNG."
              )

          with open(
              "data/fwi_forecast.png",
              "wb"
          ) as f:
              f.write(response.content)

          print(
              "FWI forecast image saved."
          )


          # =====================================================
          # GetFeatureInfo
          #
          # نکته:
          # دیگر اولین عدد پاسخ را FWI فرض نمی‌کنیم.
          # فقط پاسخ‌هایی را قبول می‌کنیم که واقعاً
          # شامل عبارت FWI / fwi باشند.
          # =====================================================

          def get_fwi(lon, lat):

              delta = 0.05

              bbox = (
                  f"{lon - delta},"
                  f"{lat - delta},"
                  f"{lon + delta},"
                  f"{lat + delta}"
              )

              params = {
                  "SERVICE": "WMS",
                  "VERSION": "1.1.1",
                  "REQUEST": "GetFeatureInfo",
                  "LAYERS": LAYER,
                  "QUERY_LAYERS": LAYER,
                  "STYLES": "",
                  "SRS": "EPSG:4326",
                  "BBOX": bbox,
                  "WIDTH": "101",
                  "HEIGHT": "101",
                  "X": "50",
                  "Y": "50",
                  "INFO_FORMAT": "text/plain",
                  "FEATURE_COUNT": "1",
                  "TIME": target_date
              }

              try:

                  r = requests.get(
                      GWIS_URL,
                      params=params,
                      timeout=30
                  )

                  if r.status_code != 200:
                      return None

                  text = r.text.strip()

                  if not text:
                      return None

                  print(
                      f"POINT {lat},{lon}: "
                      f"{text[:300]}"
                  )

                  # -----------------------------------------
                  # فقط اگر پاسخ واقعاً نام FWI را داشته باشد
                  # -----------------------------------------

                  patterns = [
                      r"\bfwi\b\s*[:=]\s*(-?\d+(?:\.\d+)?)",
                      r"\bfwinx\b\s*[:=]\s*(-?\d+(?:\.\d+)?)",
                      r"fire.?weather.?index\s*[:=]\s*(-?\d+(?:\.\d+)?)"
                  ]

                  for pattern in patterns:

                      match = re.search(
                          pattern,
                          text,
                          re.IGNORECASE
                      )

                      if match:

                          value = float(
                              match.group(1)
                          )

                          if 0 <= value <= 150:

                              return round(
                                  value,
                                  3
                              )

                  # -----------------------------------------
                  # اگر عبارت FWI وجود داشت ولی ساختار
                  # پاسخ متفاوت بود، عدد را حدس نمی‌زنیم.
                  # -----------------------------------------

                  return None

              except Exception as e:

                  print(
                      "GetFeatureInfo error:",
                      e
                  )

                  return None


          # =====================================================
          # شبکه نقاط
          # =====================================================

          points = []

          # فاصله تقریبی مناسب برای FWI
          # حدود چند کیلومتر

          lat = SOUTH

          while lat <= NORTH:

              lon = WEST

              while lon <= EAST:

                  value = get_fwi(
                      round(lon, 4),
                      round(lat, 4)
                  )

                  if value is not None:

                      points.append({
                          "lat": round(lat, 4),
                          "lon": round(lon, 4),
                          "fwi": value
                      })

                  lon += 0.25

              lat += 0.25


          # =====================================================
          # آمار
          # =====================================================

          if points:

              values = [
                  p["fwi"]
                  for p in points
              ]

              minimum = min(values)

              maximum = max(values)

              mean = round(
                  sum(values) / len(values),
                  3
              )

          else:

              minimum = None
              maximum = None
              mean = None


          # =====================================================
          # خروجی
          # =====================================================

          output = {

              "forecast_gregorian": target_date,

              "forecast_shamsi": shamsi_date,

              "generated_at_iran":
                  now.strftime("%Y-%m-%d %H:%M"),

              "source":
                  "Copernicus GWIS / ECMWF",

              "layer":
                  LAYER,

              "region":
                  "Fars Province, Iran",

              "bbox": [
                  WEST,
                  SOUTH,
                  EAST,
                  NORTH
              ],

              "points": points,

              "statistics": {

                  "count": len(points),

                  "min": minimum,

                  "max": maximum,

                  "mean": mean
              },

              "image":
                  "fwi_forecast.png"
          }


          with open(
              "data/fwi.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("================================")
          print("FWI FORECAST RESULT")
          print("================================")
          print(
              "Forecast:",
              target_date
          )
          print(
              "Shamsi:",
              shamsi_date
          )
          print(
              "Valid numeric points:",
              len(points)
          )
          print(
              "Minimum:",
              minimum
          )
          print(
              "Maximum:",
              maximum
          )
          print(
              "Mean:",
              mean
          )
          print("================================")


          # =====================================================
          # اگر هیچ مقدار واقعی دریافت نشد،
          # Workflow موفق ظاهری ایجاد نکند.
          # =====================================================

          if not points:

              raise RuntimeError(
                  "No valid numeric FWI values were returned "
                  "by GWIS GetFeatureInfo."
              )

          PY

          python request_fwi.py


      - name: Show result
        run: |

          echo "=============================="
          echo "FWI FORECAST"
          echo "=============================="

          cat data/fwi.json

          echo "=============================="


      - name: Save FWI
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fwi.json

          git add data/fwi_forecast.png

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit -m "Update FWI forecast"

            git push

          fi
