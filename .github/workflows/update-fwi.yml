name: Update FWI Fars

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install "cdsapi>=0.7.7" xarray cfgrib eccodes

      - name: Download FWI
        env:
          EWDS_API_KEY: ${{ secrets.EWDS_API_KEY }}
        run: |
          mkdir -p data

          cat > request_fwi.py <<'PY'
          import os
          import cdsapi

          client = cdsapi.Client(
              url="https://ewds.climate.copernicus.eu/api",
              key=os.environ["EWDS_API_KEY"]
          )

          request = {
              "product_type": "reanalysis",
              "variable": "fire_weather_index",
              "dataset_type": "consolidated_dataset",
              "system_version": "4_1",
              "year": "2025",
              "month": "08",
              "day": "20",
              "grid": "original_grid",
              "data_format": "grib",
              "area": [32, 50, 27, 55.8]
          }

          client.retrieve(
              "cems-fire-historical-v1",
              request,
              "data/fwi_fars.grib"
          )
          PY

          python request_fwi.py

      - name: Extract FWI values
        run: |
          cat > extract_fwi.py <<'PY'
          import json
          import xarray as xr

          file = "data/fwi_fars.grib"

          ds = xr.open_dataset(
              file,
              engine="cfgrib",
              backend_kwargs={
                  "indexpath": ""
              }
          )

          print("Variables:")
          print(list(ds.data_vars))

          variable = list(ds.data_vars)[0]
          da = ds[variable]

          lat_name = "latitude"
          lon_name = "longitude"

          lats = da[lat_name].values
          lons = da[lon_name].values
          values = da.values

          points = []

          for i, lat in enumerate(lats):
              for j, lon in enumerate(lons):
                  value = values[i][j]

                  if value == value:
                      points.append({
                          "lat": float(lat),
                          "lon": float(lon),
                          "fwi": float(value)
                      })

          output = {
              "date": "2025-08-20",
              "variable": variable,
              "source": "Copernicus CEMS Fire Weather Index",
              "points": points
          }

          with open("data/fwi.json", "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("FWI variable:", variable)
          print("FWI points:", len(points))
          print("Created: data/fwi.json")
          PY

          python extract_fwi.py

      - name: Check output
        run: |
          echo "GRIB:"
          ls -lh data/fwi_fars.grib

          echo "JSON:"
          ls -lh data/fwi.json

          echo "Files:"
          find data -maxdepth 1 -type f -print
