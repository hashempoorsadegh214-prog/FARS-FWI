name: Update FWI Fars

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install "cdsapi>=0.7.7" xarray cfgrib eccodes numpy geopandas shapely

      - name: Download FWI
        env:
          EWDS_API_KEY: ${{ secrets.EWDS_API_KEY }}
        run: |
          mkdir -p data

          cat > request_fwi.py <<'PY'
          import os
          import cdsapi

          client = cdsapi.Client(
              url="https://ewds.climate.copernicus.eu/api",
              key=os.environ["EWDS_API_KEY"]
          )

          request = {
              "product_type": "reanalysis",
              "variable": "fire_weather_index",
              "dataset_type": "consolidated_dataset",
              "system_version": "4_1",
              "year": "2025",
              "month": "08",
              "day": "20",
              "grid": "original_grid",
              "data_format": "grib",
              "area": [32, 50, 27, 55.8]
          }

          client.retrieve(
              "cems-fire-historical-v1",
              request,
              "data/fwi_fars.grib"
          )
          PY

          python request_fwi.py

      - name: Extract FWI for Fars
        run: |
          cat > extract_fwi.py <<'PY'
          import json
          import numpy as np
          import xarray as xr
          import geopandas as gpd
          from shapely.geometry import Point

          GRIB_FILE = "data/fwi_fars.grib"
          BOUNDARY_FILE = "fars.geojson"
          OUTPUT_FILE = "data/fwi_fars.json"

          print("================================")
          print("Reading FWI...")
          print("================================")

          ds = xr.open_dataset(
              GRIB_FILE,
              engine="cfgrib",
              backend_kwargs={
                  "indexpath": ""
              }
          )

          print("Variables:", list(ds.data_vars))
          print("Dimensions:", dict(ds.sizes))
          print("Coordinates:", list(ds.coords))

          if "fwinx" not in ds:
              raise RuntimeError(
                  "Variable fwinx was not found."
              )

          da = ds["fwinx"]

          values = np.asarray(
              da.values
          ).squeeze()

          print("FWI shape:", values.shape)
          print("FWI dimensions:", da.dims)

          # -----------------------------------------
          # خواندن مرز استان فارس
          # -----------------------------------------

          fars = gpd.read_file(
              BOUNDARY_FILE
          )

          if fars.empty:
              raise RuntimeError(
                  "fars.geojson is empty."
              )

          if fars.crs is None:
              fars = fars.set_crs(
                  "EPSG:4326"
              )
          else:
              fars = fars.to_crs(
                  "EPSG:4326"
              )

          geometry = fars.geometry.union_all()

          print("Fars boundary loaded.")

          points = []

          # =========================================
          # حالت 1: شبکه دوبعدی
          # =========================================

          if values.ndim == 2:

              if (
                  "latitude" not in ds.coords
                  or
                  "longitude" not in ds.coords
              ):
                  raise RuntimeError(
                      "Latitude/longitude coordinates not found."
                  )

              latitudes = np.asarray(
                  ds["latitude"].values
              )

              longitudes = np.asarray(
                  ds["longitude"].values
              )

              print(
                  "Latitude count:",
                  len(latitudes)
              )

              print(
                  "Longitude count:",
                  len(longitudes)
              )

              for i, lat in enumerate(latitudes):

                  for j, lon in enumerate(longitudes):

                      value = values[i, j]

                      if not np.isfinite(value):
                          continue

                      point = Point(
                          float(lon),
                          float(lat)
                      )

                      # فقط داخل فارس
                      if geometry.covers(point):

                          points.append({
                              "fwi": round(
                                  float(value),
                                  3
                              ),
                              "lat": round(
                                  float(lat),
                                  6
                              ),
                              "lon": round(
                                  float(lon),
                                  6
                              )
                          })

          # =========================================
          # حالت 2: فایل CEMS با 339 سلول
          # =========================================

          elif values.ndim == 1:

              print(
                  "FWI is a 1D list of grid cells."
              )

              if (
                  "latitude" not in ds.coords
                  or
                  "longitude" not in ds.coords
              ):
                  raise RuntimeError(
                      "Latitude/longitude coordinates "
                      "for the 1D FWI cells were not found."
                  )

              latitudes = np.asarray(
                  ds["latitude"].values
              ).squeeze()

              longitudes = np.asarray(
                  ds["longitude"].values
              ).squeeze()

              print(
                  "FWI cells:",
                  len(values)
              )

              print(
                  "Latitude cells:",
                  len(latitudes)
              )

              print(
                  "Longitude cells:",
                  len(longitudes)
              )

              if len(latitudes) != len(values):
                  raise RuntimeError(
                      "Latitude count does not match FWI count."
                  )

              if len(longitudes) != len(values):
                  raise RuntimeError(
                      "Longitude count does not match FWI count."
                  )

              for i, value in enumerate(values):

                  if not np.isfinite(value):
                      continue

                  lat = float(
                      latitudes[i]
                  )

                  lon = float(
                      longitudes[i]
                  )

                  point = Point(
                      lon,
                      lat
                  )

                  # ---------------------------------
                  # مهم:
                  # فقط نقاط داخل مرز استان فارس
                  # ---------------------------------

                  if geometry.covers(point):

                      points.append({
                          "index": i,
                          "fwi": round(
                              float(value),
                              3
                          ),
                          "lat": round(
                              lat,
                              6
                          ),
                          "lon": round(
                              lon,
                              6
                          )
                      })

          else:

              raise RuntimeError(
                  f"Unsupported FWI shape: {values.shape}"
              )

          # =========================================
          # ساخت خروجی
          # =========================================

          output = {
              "date": "2025-08-20",
              "variable": "fwinx",
              "source": "Copernicus CEMS Fire Weather Index",
              "region": "Fars Province, Iran",
              "points": points
          }

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # =========================================
          # گزارش نتیجه
          # =========================================

          print("")
          print("================================")
          print("FWI FARS RESULT")
          print("================================")

          print(
              "Total FWI cells:",
              len(values)
          )

          print(
              "Cells inside Fars:",
              len(points)
          )

          if points:

              fwi_values = [
                  p["fwi"]
                  for p in points
              ]

              print(
                  "Minimum FWI:",
                  min(fwi_values)
              )

              print(
                  "Maximum FWI:",
                  max(fwi_values)
              )

              print(
                  "Mean FWI:",
                  round(
                      sum(fwi_values)
                      / len(fwi_values),
                      3
                  )
              )

          else:

              print(
                  "WARNING: No FWI cells found inside Fars."
              )

          print(
              "Output:",
              OUTPUT_FILE
          )

          print("================================")

          ds.close()
          PY

          python extract_fwi.py

      - name: Show result
        run: |
          echo "========== FWI FARS =========="
          cat data/fwi_fars.json
          echo "=============================="

      - name: Save FWI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fwi_fars.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update FWI Fars"
            git push
          fi
