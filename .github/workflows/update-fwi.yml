```yaml
name: Update FWI Fars

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. دریافت ریپو
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. نصب Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # 3. نصب وابستگی‌ها
      # ==========================================
      - name: Install dependencies
        run: |
          pip install "cdsapi>=0.7.7" xarray cfgrib eccodes numpy geopandas shapely

      # ==========================================
      # 4. دریافت FWI فردا
      # ==========================================
      - name: Download and extract FWI
        env:
          EWDS_API_KEY: ${{ secrets.EWDS_API_KEY }}
        run: |
          mkdir -p data

          cat > request_fwi.py <<'PY'
          import os
          import json
          import cdsapi
          import numpy as np
          import xarray as xr
          import geopandas as gpd
          from shapely.geometry import Point
          from datetime import datetime, timedelta, timezone

          # ==========================================
          # زمان ایران
          # ==========================================

          iran_tz = timezone(timedelta(hours=3, minutes=30))
          now = datetime.now(iran_tz)

          target = now.date() + timedelta(days=1)
          target_date = target.strftime("%Y-%m-%d")

          print("================================")
          print("FWI FORECAST")
          print("================================")
          print(
              "Iran current date:",
              now.strftime("%Y-%m-%d %H:%M")
          )
          print(
              "Forecast Gregorian:",
              target_date
          )

          # ==========================================
          # تبدیل میلادی به شمسی
          # ==========================================

          def gregorian_to_jalali(gy, gm, gd):

              g_days = [
                  31, 28, 31, 30, 31, 30,
                  31, 31, 30, 31, 30, 31
              ]

              if gy % 4 == 0 and (
                  gy % 100 != 0 or gy % 400 == 0
              ):
                  g_days[1] = 29

              gy2 = gy - 1600
              gm2 = gm - 1
              gd2 = gd - 1

              g_day_no = (
                  365 * gy2
                  + (gy2 + 3) // 4
                  - (gy2 + 99) // 100
                  + (gy2 + 399) // 400
              )

              for i in range(gm2):
                  g_day_no += g_days[i]

              g_day_no += gd2

              j_day_no = g_day_no - 79

              j_np = j_day_no // 12053
              j_day_no %= 12053

              jy = (
                  979
                  + 33 * j_np
                  + 4 * (j_day_no // 1461)
              )

              j_day_no %= 1461

              if j_day_no >= 366:
                  jy += (j_day_no - 1) // 365
                  j_day_no = (j_day_no - 1) % 365

              if j_day_no < 186:
                  jm = 1 + j_day_no // 31
                  jd = 1 + j_day_no % 31
              else:
                  jm = 7 + (j_day_no - 186) // 30
                  jd = 1 + (j_day_no - 186) % 30

              return jy, jm, jd

          jy, jm, jd = gregorian_to_jalali(
              target.year,
              target.month,
              target.day
          )

          shamsi_date = f"{jy:04d}-{jm:02d}-{jd:02d}"

          print(
              "Forecast Shamsi:",
              shamsi_date
          )

          print("================================")

          # ==========================================
          # محدوده فارس
          # ==========================================

          BOUNDARY_FILE = "fars.geojson"
          GRIB_FILE = "data/fwi_fars.grib"
          OUTPUT_FILE = "data/fwi_fars.json"

          # ==========================================
          # درخواست CEMS
          # ==========================================

          client = cdsapi.Client(
              url="https://ewds.climate.copernicus.eu/api",
              key=os.environ["EWDS_API_KEY"]
          )

          request = {
              "product_type": "reanalysis",
              "variable": "fire_weather_index",
              "dataset_type": "consolidated_dataset",
              "system_version": "4_1",

              "year": str(target.year),
              "month": f"{target.month:02d}",
              "day": f"{target.day:02d}",

              "grid": "original_grid",
              "data_format": "grib",

              # North, West, South, East
              "area": [
                  32,
                  50,
                  27,
                  55
              ]
          }

          print("Requesting CEMS...")
          print(request)

          client.retrieve(
              "cems-fire-historical-v1",
              request,
              GRIB_FILE
          )

          print("GRIB downloaded.")

          # ==========================================
          # خواندن GRIB
          # ==========================================

          print("Reading GRIB...")

          ds = xr.open_dataset(
              GRIB_FILE,
              engine="cfgrib",
              backend_kwargs={
                  "indexpath": ""
              }
          )

          print("Variables:", list(ds.data_vars))
          print("Dimensions:", dict(ds.sizes))

          if "fwinx" not in ds.data_vars:
              raise RuntimeError(
                  "FWI variable fwinx was not found."
              )

          da = ds["fwinx"]

          values = np.asarray(
              da.values
          ).squeeze()

          print("FWI shape:", values.shape)

          # ==========================================
          # مختصات
          # ==========================================

          if "latitude" not in ds.coords:
              raise RuntimeError(
                  "Latitude coordinate not found."
              )

          if "longitude" not in ds.coords:
              raise RuntimeError(
                  "Longitude coordinate not found."
              )

          latitudes = np.asarray(
              ds["latitude"].values
          )

          longitudes = np.asarray(
              ds["longitude"].values
          )

          # ==========================================
          # مرز فارس
          # ==========================================

          fars = gpd.read_file(
              BOUNDARY_FILE
          )

          if fars.crs is None:
              fars = fars.set_crs(
                  "EPSG:4326"
              )
          else:
              fars = fars.to_crs(
                  "EPSG:4326"
              )

          try:
              geometry = fars.geometry.union_all()
          except AttributeError:
              geometry = fars.geometry.unary_union

          # ==========================================
          # استخراج نقاط داخل فارس
          # ==========================================

          points = []

          # حالت شبکه‌ای دوبعدی
          if values.ndim == 2:

              print("Processing 2D FWI grid...")

              for i, lat in enumerate(latitudes):

                  for j, lon in enumerate(longitudes):

                      value = values[i, j]

                      if not np.isfinite(value):
                          continue

                      point = Point(
                          float(lon),
                          float(lat)
                      )

                      if geometry.contains(point):

                          points.append({
                              "lat": round(
                                  float(lat), 6
                              ),
                              "lon": round(
                                  float(lon), 6
                              ),
                              "fwi": round(
                                  float(value), 3
                              )
                          })

          # ==========================================
          # حالت آرایه یک‌بعدی
          # ==========================================

          elif values.ndim == 1:

              print("Processing 1D FWI grid...")

              if (
                  len(latitudes) != len(values)
                  or
                  len(longitudes) != len(values)
              ):
                  raise RuntimeError(
                      "1D FWI array does not match coordinates."
                  )

              for i, value in enumerate(values):

                  if not np.isfinite(value):
                      continue

                  lat = float(latitudes[i])
                  lon = float(longitudes[i])

                  point = Point(
                      lon,
                      lat
                  )

                  if geometry.contains(point):

                      points.append({
                          "lat": round(
                              lat, 6
                          ),
                          "lon": round(
                              lon, 6
                          ),
                          "fwi": round(
                              float(value), 3
                          )
                      })

          else:

              raise RuntimeError(
                  f"Unsupported FWI shape: {values.shape}"
              )

          # ==========================================
          # بررسی نتیجه
          # ==========================================

          print("================================")
          print("FWI FORECAST RESULT")
          print("================================")

          print(
              "Forecast:",
              target_date
          )

          print(
              "Shamsi:",
              shamsi_date
          )

          print(
              "Valid points:",
              len(points)
          )

          if not points:

              raise RuntimeError(
                  "No valid FWI points were found inside Fars."
              )

          fwi_values = [
              p["fwi"]
              for p in points
          ]

          minimum = min(fwi_values)
          maximum = max(fwi_values)
          mean = sum(fwi_values) / len(fwi_values)

          print(
              "Minimum:",
              round(minimum, 3)
          )

          print(
              "Maximum:",
              round(maximum, 3)
          )

          print(
              "Mean:",
              round(mean, 3)
          )

          # ==========================================
          # خروجی JSON
          # ==========================================

          output = {
              "forecast_gregorian": target_date,
              "forecast_shamsi": shamsi_date,
              "generated_at_iran": now.strftime(
                  "%Y-%m-%d %H:%M"
              ),
              "source":
                  "Copernicus CEMS Fire Weather Index",
              "variable":
                  "fwinx",
              "region":
                  "Fars Province, Iran",
              "bbox": [
                  50.0,
                  27.0,
                  55.0,
                  32.0
              ],
              "statistics": {
                  "min": round(
                      float(minimum), 3
                  ),
                  "max": round(
                      float(maximum), 3
                  ),
                  "mean": round(
                      float(mean), 3
                  ),
                  "count": len(points)
              },
              "points": points
          }

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("FWI JSON READY")
          print(
              "Output:",
              OUTPUT_FILE
          )
          print("================================")

          PY

          python request_fwi.py

      # ==========================================
      # 5. نمایش خروجی
      # ==========================================
      - name: Show FWI result
        run: |
          echo "================================"
          echo "FWI FARS"
          echo "================================"
          cat data/fwi_fars.json
          echo "================================"

      # ==========================================
      # 6. ذخیره در GitHub
      # ==========================================
      - name: Save FWI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fwi_fars.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update FWI forecast for tomorrow"
            git push
          fi
```
