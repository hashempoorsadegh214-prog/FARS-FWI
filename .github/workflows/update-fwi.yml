```yaml
name: Update FWI Fars

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------
      # 1. دریافت پروژه
      # ---------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------
      # 2. Python
      # ---------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------
      # 3. نصب ابزارها
      # ---------------------------------------
      - name: Install dependencies
        run: |
          pip install requests pillow numpy

      # ---------------------------------------
      # 4. دریافت FWI برای فردا از GWIS
      # ---------------------------------------
      - name: Download FWI Forecast
        run: |

          mkdir -p data

          cat > request_fwi.py <<'PY'
          import requests
          import json
          import math
          from datetime import datetime, timedelta, timezone

          # ==========================================
          # تاریخ ایران
          # ==========================================

          iran_tz = timezone(timedelta(hours=3, minutes=30))

          now = datetime.now(iran_tz)

          # هشدار برای فردا
          target = now.date() + timedelta(days=1)

          target_date = target.strftime("%Y-%m-%d")

          print("================================")
          print("FWI FORECAST")
          print("================================")

          print("Iran current date:", now.strftime("%Y-%m-%d %H:%M"))
          print("Forecast Gregorian:", target_date)

          # ==========================================
          # تبدیل میلادی به شمسی
          # ==========================================

          def gregorian_to_jalali(gy, gm, gd):

              g_days_in_month = [
                  31, 28, 31, 30, 31, 30,
                  31, 31, 30, 31, 30, 31
              ]

              if gy % 4 == 0 and (
                  gy % 100 != 0 or gy % 400 == 0
              ):
                  g_days_in_month[1] = 29

              gy2 = gy - 1600
              gm2 = gm - 1
              gd2 = gd - 1

              g_day_no = (
                  365 * gy2
                  + (gy2 + 3) // 4
                  - (gy2 + 99) // 100
                  + (gy2 + 399) // 400
              )

              for i in range(gm2):
                  g_day_no += g_days_in_month[i]

              g_day_no += gd2

              j_day_no = g_day_no - 79

              j_np = j_day_no // 12053
              j_day_no %= 12053

              jy = 979 + 33 * j_np + 4 * (j_day_no // 1461)

              j_day_no %= 1461

              if j_day_no >= 366:
                  jy += (j_day_no - 1) // 365
                  j_day_no = (j_day_no - 1) % 365

              if j_day_no < 186:
                  jm = 1 + j_day_no // 31
                  jd = 1 + j_day_no % 31
              else:
                  jm = 7 + (j_day_no - 186) // 30
                  jd = 1 + (j_day_no - 186) % 30

              return jy, jm, jd

          jy, jm, jd = gregorian_to_jalali(
              target.year,
              target.month,
              target.day
          )

          shamsi_date = f"{jy:04d}-{jm:02d}-{jd:02d}"

          print("Forecast Shamsi:", shamsi_date)
          print("================================")

          # ==========================================
          # GWIS WMS
          # ==========================================

          url = "https://maps.effis.emergency.copernicus.eu/gwis"

          params = {
              "SERVICE": "WMS",
              "VERSION": "1.1.1",
              "REQUEST": "GetMap",
              "LAYERS": "ecmwf.fwi",
              "STYLES": "",
              "SRS": "EPSG:4326",

              # فارس
              "BBOX": "50.0,27.0,55.0,32.0",

              "WIDTH": "1000",
              "HEIGHT": "1000",

              # مهم:
              # GWIS image/geotiff را قبول نمی‌کند.
              # از image/png استفاده می‌کنیم.
              "FORMAT": "image/png",

              "TRANSPARENT": "TRUE",

              # تاریخ پیش‌بینی
              "TIME": target_date
          }

          print("Requesting GWIS...")
          print("Layer:", params["LAYERS"])
          print("Time:", target_date)

          response = requests.get(
              url,
              params=params,
              timeout=120
          )

          print("HTTP status:", response.status_code)
          print("Content-Type:", response.headers.get("Content-Type"))

          if response.status_code != 200:
              raise RuntimeError(
                  f"GWIS HTTP error: {response.status_code}"
              )

          content_type = response.headers.get(
              "Content-Type",
              ""
          ).lower()

          if "image/png" not in content_type:
              print(response.text[:2000])

              raise RuntimeError(
                  "GWIS did not return PNG."
              )

          with open(
              "data/fwi_forecast.png",
              "wb"
          ) as f:
              f.write(response.content)

          print("GWIS image saved.")

          # ==========================================
          # توجه مهم
          #
          # PNG مقدار عددی FWI را در خود پیکسل
          # به صورت مستقیم نگه نمی‌دارد.
          #
          # بنابراین برای سایت، فعلاً تصویر
          # هشدار FWI فردا را ذخیره می‌کنیم.
          # ==========================================

          output = {
              "forecast_gregorian": target_date,
              "forecast_shamsi": shamsi_date,
              "source": "Copernicus GWIS / ECMWF",
              "layer": "ecmwf.fwi",
              "bbox": [
                  50.0,
                  27.0,
                  55.0,
                  32.0
              ],
              "image": "fwi_forecast.png"
          }

          with open(
              "data/fwi.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("FWI FORECAST READY")
          print("Date:", target_date)
          print("Shamsi:", shamsi_date)
          print("================================")

          PY

          python request_fwi.py

      # ---------------------------------------
      # 5. نمایش نتیجه
      # ---------------------------------------
      - name: Show result
        run: |
          echo "=============================="
          echo "FWI FORECAST"
          echo "=============================="
          cat data/fwi.json
          echo "=============================="

      # ---------------------------------------
      # 6. ذخیره در GitHub
      # ---------------------------------------
      - name: Save FWI
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fwi.json
          git add data/fwi_forecast.png

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit -m "Update FWI forecast"

            git push

          fi
```
