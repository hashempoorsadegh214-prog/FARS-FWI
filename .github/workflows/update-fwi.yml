name: Update FWI Fars

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pillow numpy

      - name: Test GWIS GetFeatureInfo
        run: |
          python - <<'PY'
          import requests

          URL = "https://maps.effis.emergency.copernicus.eu/gwis"

          params = {
              "SERVICE": "WMS",
              "VERSION": "1.1.1",
              "REQUEST": "GetFeatureInfo",
              "LAYERS": "ecmwf.fwi",
              "QUERY_LAYERS": "ecmwf.fwi",
              "STYLES": "",
              "SRS": "EPSG:4326",
              "BBOX": "52.57,29.58,52.60,29.61",
              "WIDTH": "100",
              "HEIGHT": "100",
              "X": "50",
              "Y": "50",
              "INFO_FORMAT": "text/plain",
              "TIME": "2026-08-22"
          }

          print("================================")
          print("GWIS GETFEATUREINFO TEST")
          print("================================")
          print("Point: 52.5837, 29.5918")
          print("Date: 2026-08-22")
          print("Layer: ecmwf.fwi")
          print("================================")

          response = requests.get(
              URL,
              params=params,
              timeout=120
          )

          print("HTTP:", response.status_code)
          print(
              "Content-Type:",
              response.headers.get("Content-Type")
          )

          print("================================")
          print("GWIS RESPONSE")
          print("================================")

          print(response.text[:5000])

          print("================================")
          PY

      - name: Download FWI Forecast
        run: |
          mkdir -p data

          cat > request_fwi.py <<'PY'
          import requests
          import json
          from datetime import datetime, timedelta, timezone

          iran_tz = timezone(timedelta(hours=3, minutes=30))
          now = datetime.now(iran_tz)
          target = now.date() + timedelta(days=1)

          target_date = target.strftime("%Y-%m-%d")

          print("================================")
          print("FWI FORECAST")
          print("================================")
          print("Iran current date:", now.strftime("%Y-%m-%d %H:%M"))
          print("Forecast Gregorian:", target_date)

          def gregorian_to_jalali(gy, gm, gd):

              g_days = [
                  31, 28, 31, 30, 31, 30,
                  31, 31, 30, 31, 30, 31
              ]

              if gy % 4 == 0 and (
                  gy % 100 != 0 or gy % 400 == 0
              ):
                  g_days[1] = 29

              gy2 = gy - 1600
              gm2 = gm - 1
              gd2 = gd - 1

              g_day_no = (
                  365 * gy2
                  + (gy2 + 3) // 4
                  - (gy2 + 99) // 100
                  + (gy2 + 399) // 400
              )

              for i in range(gm2):
                  g_day_no += g_days[i]

              g_day_no += gd2

              j_day_no = g_day_no - 79

              j_np = j_day_no // 12053
              j_day_no %= 12053

              jy = (
                  979
                  + 33 * j_np
                  + 4 * (j_day_no // 1461)
              )

              j_day_no %= 1461

              if j_day_no >= 366:
                  jy += (j_day_no - 1) // 365
                  j_day_no = (j_day_no - 1) % 365

              if j_day_no < 186:
                  jm = 1 + j_day_no // 31
                  jd = 1 + j_day_no % 31
              else:
                  jm = 7 + (j_day_no - 186) // 30
                  jd = 1 + (j_day_no - 186) % 30

              return jy, jm, jd

          jy, jm, jd = gregorian_to_jalali(
              target.year,
              target.month,
              target.day
          )

          shamsi_date = f"{jy:04d}-{jm:02d}-{jd:02d}"

          print("Forecast Shamsi:", shamsi_date)
          print("================================")

          url = "https://maps.effis.emergency.copernicus.eu/gwis"

          params = {
              "SERVICE": "WMS",
              "VERSION": "1.1.1",
              "REQUEST": "GetFeatureInfo",
              "LAYERS": "ecmwf.fwi",
              "QUERY_LAYERS": "ecmwf.fwi",
              "STYLES": "",
              "SRS": "EPSG:4326",
              "BBOX": "52.57,29.58,52.60,29.61",
              "WIDTH": "100",
              "HEIGHT": "100",
              "X": "50",
              "Y": "50",
              "INFO_FORMAT": "text/plain",
              "TIME": target_date
          }

          response = requests.get(
              url,
              params=params,
              timeout=120
          )

          print("================================")
          print("GWIS RESPONSE")
          print("================================")
          print(response.text[:5000])
          print("================================")

          with open(
              "data/fwi.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  {
                      "forecast_gregorian": target_date,
                      "forecast_shamsi": shamsi_date,
                      "generated_at_iran":
                          now.strftime("%Y-%m-%d %H:%M"),
                      "source":
                          "Copernicus GWIS / ECMWF",
                      "layer":
                          "ecmwf.fwi",
                      "region":
                          "Fars Province, Iran",
                      "test_point": {
                          "lat": 29.5918,
                          "lon": 52.5837
                      },
                      "raw_response":
                          response.text[:5000]
                  },
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("FWI test saved.")
          PY

          python request_fwi.py

      - name: Show result
        run: |
          echo "=============================="
          echo "FWI FORECAST"
          echo "=============================="
          cat data/fwi.json
          echo "=============================="

      - name: Save FWI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fwi.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Test FWI GetFeatureInfo"
            git push
          fi
