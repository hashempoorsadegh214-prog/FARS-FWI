name: Update FWI Fars

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install "cdsapi>=0.7.7" xarray cfgrib eccodes numpy

      - name: Download FWI
        env:
          EWDS_API_KEY: ${{ secrets.EWDS_API_KEY }}
        run: |
          mkdir -p data

          cat > request_fwi.py <<'PY'
          import os
          import cdsapi

          client = cdsapi.Client(
              url="https://ewds.climate.copernicus.eu/api",
              key=os.environ["EWDS_API_KEY"]
          )

          request = {
              "product_type": "reanalysis",
              "variable": "fire_weather_index",
              "dataset_type": "consolidated_dataset",
              "system_version": "4_1",
              "year": "2025",
              "month": "08",
              "day": "20",
              "grid": "original_grid",
              "data_format": "grib",
              "area": [32, 50, 27, 55.8]
          }

          client.retrieve(
              "cems-fire-historical-v1",
              request,
              "data/fwi_fars.grib"
          )
          PY

          python request_fwi.py

      - name: Extract FWI
        run: |
          cat > extract_fwi.py <<'PY'
          import json
          import numpy as np
          import xarray as xr

          file = "data/fwi_fars.grib"

          ds = xr.open_dataset(
              file,
              engine="cfgrib",
              backend_kwargs={
                  "indexpath": ""
              }
          )

          print("Variables:", list(ds.data_vars))
          print("Dimensions:", dict(ds.sizes))

          da = ds["fwinx"]

          print("FWI dimensions:", da.dims)
          print("FWI shape:", da.shape)
          print("FWI value:", da.values)

          value = np.asarray(da.values).squeeze()

          output = {
              "date": "2025-08-20",
              "variable": "fwinx",
              "source": "Copernicus CEMS Fire Weather Index",
              "points": []
          }

          if value.ndim == 0:
              output["points"].append({
                  "fwi": float(value)
              })

          elif value.ndim == 1:
              for i, v in enumerate(value):
                  if np.isfinite(v):
                      output["points"].append({
                          "index": i,
                          "fwi": float(v)
                      })

          elif value.ndim == 2:
              lats = np.asarray(da.latitude.values)
              lons = np.asarray(da.longitude.values)

              for i, lat in enumerate(lats):
                  for j, lon in enumerate(lons):
                      v = value[i, j]

                      if np.isfinite(v):
                          output["points"].append({
                              "lat": float(lat),
                              "lon": float(lon),
                              "fwi": float(v)
                          })

          else:
              raise RuntimeError(
                  f"Unexpected FWI dimensions: {value.ndim}"
              )

          with open(
              "data/fwi.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Number of FWI values:", len(output["points"]))
          print("Created data/fwi.json")
          PY

          python extract_fwi.py

      - name: Show result
        run: |
          echo "========== FWI RESULT =========="
          cat data/fwi.json
          echo "================================"

      - name: Save JSON to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fwi.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update FWI data"
            git push
          fi
