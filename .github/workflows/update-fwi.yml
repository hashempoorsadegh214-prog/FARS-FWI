
name: Update FWI Fars

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests numpy rasterio geopandas shapely

      - name: Download FWI forecast
        run: |

          mkdir -p data

          cat > request_fwi.py <<'PY'
          import json
          import math
          import requests
          import numpy as np
          import rasterio
          import geopandas as gpd

          from datetime import datetime, timedelta, timezone
          from xml.etree import ElementTree as ET
          from shapely.geometry import Point


          # =========================================================
          # تنظیمات
          # =========================================================

          WMS_URL = "https://maps.effis.emergency.copernicus.eu/effis"

          BBOX = (
              50.0,
              27.0,
              55.0,
              32.0
          )

          WIDTH = 1000
          HEIGHT = 1000


          # =========================================================
          # زمان ایران
          # =========================================================

          IRAN_TZ = timezone(
              timedelta(hours=3, minutes=30)
          )

          now = datetime.now(IRAN_TZ)

          target = now.date() + timedelta(days=1)

          target_date = target.strftime("%Y-%m-%d")


          print("================================")
          print("FWI FORECAST")
          print("================================")

          print(
              "Iran current date:",
              now.strftime("%Y-%m-%d %H:%M")
          )

          print(
              "Forecast Gregorian:",
              target_date
          )


          # =========================================================
          # تبدیل میلادی به شمسی
          # =========================================================

          def gregorian_to_jalali(gy, gm, gd):

              g_days = [
                  31, 28, 31, 30, 31, 30,
                  31, 31, 30, 31, 30, 31
              ]

              if gy % 4 == 0 and (
                  gy % 100 != 0
                  or gy % 400 == 0
              ):
                  g_days[1] = 29

              gy2 = gy - 1600
              gm2 = gm - 1
              gd2 = gd - 1

              g_day_no = (
                  365 * gy2
                  + (gy2 + 3) // 4
                  - (gy2 + 99) // 100
                  + (gy2 + 399) // 400
              )

              for i in range(gm2):
                  g_day_no += g_days[i]

              g_day_no += gd2

              j_day_no = g_day_no - 79

              j_np = j_day_no // 12053

              j_day_no %= 12053

              jy = (
                  979
                  + 33 * j_np
                  + 4 * (j_day_no // 1461)
              )

              j_day_no %= 1461

              if j_day_no >= 366:

                  jy += (
                      j_day_no - 1
                  ) // 365

                  j_day_no = (
                      j_day_no - 1
                  ) % 365

              if j_day_no < 186:

                  jm = (
                      1
                      + j_day_no // 31
                  )

                  jd = (
                      1
                      + j_day_no % 31
                  )

              else:

                  jm = (
                      7
                      + (j_day_no - 186) // 30
                  )

                  jd = (
                      1
                      + (j_day_no - 186) % 30
                  )

              return jy, jm, jd


          jy, jm, jd = gregorian_to_jalali(
              target.year,
              target.month,
              target.day
          )

          shamsi_date = (
              f"{jy:04d}-{jm:02d}-{jd:02d}"
          )

          print(
              "Forecast Shamsi:",
              shamsi_date
          )

          print("================================")


          # =========================================================
          # دریافت GetCapabilities
          # =========================================================

          print("Checking EFFIS WMS capabilities...")
          print("Server:", WMS_URL)

          capabilities_params = {
              "SERVICE": "WMS",
              "VERSION": "1.1.1",
              "REQUEST": "GetCapabilities"
          }

          cap_response = requests.get(
              WMS_URL,
              params=capabilities_params,
              timeout=120
          )

          print(
              "Capabilities HTTP status:",
              cap_response.status_code
          )

          print(
              "Capabilities Content-Type:",
              cap_response.headers.get(
                  "Content-Type",
                  ""
              )
          )

          if cap_response.status_code != 200:

              print(
                  cap_response.text[:5000]
              )

              raise RuntimeError(
                  "EFFIS GetCapabilities request failed."
              )


          # =========================================================
          # پیدا کردن لایه‌های FWI
          # =========================================================

          xml_text = cap_response.text

          try:

              root = ET.fromstring(
                  xml_text
              )

          except Exception as e:

              print(
                  xml_text[:5000]
              )

              raise RuntimeError(
                  f"Could not parse WMS capabilities: {e}"
              )


          layers = []

          for elem in root.iter():

              tag = elem.tag.split("}")[-1]

              if tag.lower() == "layer":

                  name = None
                  title = None

                  for child in elem:

                      child_tag = (
                          child.tag
                          .split("}")[-1]
                          .lower()
                      )

                      if child_tag == "name":
                          name = (
                              child.text or ""
                          ).strip()

                      elif child_tag == "title":
                          title = (
                              child.text or ""
                          ).strip()

                  if name:

                      layers.append({
                          "name": name,
                          "title": title or ""
                      })


          print("Total WMS layers found:", len(layers))

          print("================================")
          print("FWI LAYER SEARCH")
          print("================================")


          # همه لایه‌هایی که FWI در نام یا عنوان دارند
          fwi_candidates = []

          for item in layers:

              text = (
                  item["name"]
                  + " "
                  + item["title"]
              ).lower()

              if "fwi" in text:

                  fwi_candidates.append(
                      item
                  )


          if fwi_candidates:

              print(
                  "FWI-related layers found:"
              )

              for item in fwi_candidates:

                  print(
                      "-",
                      item["name"],
                      "|",
                      item["title"]
                  )

          else:

              print(
                  "No layer containing FWI "
                  "was found."
              )


          # =========================================================
          # انتخاب لایه
          # =========================================================

          preferred_names = [
              "ecmwf007.fwi",
              "ecmwf.fwi",
              "ecmwf007.FWI",
              "ecmwf.FWI"
          ]

          selected_layer = None


          # اول نام‌های شناخته‌شده
          for preferred in preferred_names:

              for item in layers:

                  if (
                      item["name"].lower()
                      == preferred.lower()
                  ):

                      selected_layer = (
                          item["name"]
                      )

                      break

              if selected_layer:
                  break


          # اگر پیدا نشد، از بین FWIها
          # لایه‌ای که ECMWF دارد انتخاب شود
          if selected_layer is None:

              for item in fwi_candidates:

                  name = (
                      item["name"]
                      .lower()
                  )

                  title = (
                      item["title"]
                      .lower()
                  )

                  if (
                      "ecmwf" in name
                      or "ecmwf" in title
                  ):

                      selected_layer = (
                          item["name"]
                      )

                      break


          # =========================================================
          # اگر هیچ لایه‌ای پیدا نشد
          # =========================================================

          if selected_layer is None:

              print("================================")
              print(
                  "AVAILABLE FWI CANDIDATES"
              )
              print("================================")

              for item in fwi_candidates:

                  print(
                      item["name"],
                      "|",
                      item["title"]
                  )

              raise RuntimeError(
                  "No ECMWF FWI layer was found "
                  "automatically in EFFIS WMS."
              )


          print("================================")
          print("SELECTED FWI LAYER")
          print("================================")

          print(
              "Layer:",
              selected_layer
          )

          print("================================")


          # =========================================================
          # درخواست GetMap
          # =========================================================

          map_params = {

              "SERVICE": "WMS",

              "VERSION": "1.1.1",

              "REQUEST": "GetMap",

              "LAYERS":
                  selected_layer,

              "STYLES": "",

              "SRS":
                  "EPSG:4326",

              "BBOX":
                  ",".join(
                      str(x)
                      for x in BBOX
                  ),

              "WIDTH":
                  str(WIDTH),

              "HEIGHT":
                  str(HEIGHT),

              "FORMAT":
                  "image/tiff",

              "TRANSPARENT":
                  "TRUE",

              "TIME":
                  target_date
          }


          print("================================")
          print("REQUESTING FWI MAP")
          print("================================")

          print(
              "Layer:",
              selected_layer
          )

          print(
              "Date:",
              target_date
          )


          response = requests.get(
              WMS_URL,
              params=map_params,
              timeout=180
          )


          print(
              "HTTP status:",
              response.status_code
          )

          print(
              "Content-Type:",
              response.headers.get(
                  "Content-Type",
                  ""
              )
          )


          if response.status_code != 200:

              print(
                  response.text[:5000]
              )

              raise RuntimeError(
                  "EFFIS GetMap request failed."
              )


          content_type = (
              response.headers
              .get(
                  "Content-Type",
                  ""
              )
              .lower()
          )


          # =========================================================
          # تشخیص خطای XML حتی اگر HTTP=200 باشد
          # =========================================================

          if (
              "xml" in content_type
              or "text" in content_type
              or response.content.startswith(
                  b"<?xml"
              )
          ):

              print("================================")
              print("EFFIS WMS RESPONSE")
              print("================================")

              print(
                  response.text[:5000]
              )

              raise RuntimeError(
                  "EFFIS returned a WMS error "
                  "instead of a GeoTIFF."
              )


          if (
              "tiff" not in content_type
              and "tif" not in content_type
          ):

              print(
                  response.content[:200]
              )

              raise RuntimeError(
                  "EFFIS did not return GeoTIFF."
              )


          # =========================================================
          # ذخیره GeoTIFF
          # =========================================================

          with open(
              "data/fwi_forecast.tif",
              "wb"
          ) as f:

              f.write(
                  response.content
              )


          print(
              "GeoTIFF saved successfully."
          )


          # =========================================================
          # خواندن مرز فارس
          # =========================================================

          fars = gpd.read_file(
              "fars.geojson"
          )

          if fars.crs is None:

              fars = fars.set_crs(
                  "EPSG:4326"
              )

          else:

              fars = fars.to_crs(
                  "EPSG:4326"
              )


          try:

              fars_geometry = (
                  fars.geometry
                  .union_all()
              )

          except AttributeError:

              fars_geometry = (
                  fars.geometry
                  .unary_union
              )


          # =========================================================
          # استخراج مقادیر عددی
          # =========================================================

          points = []


          with rasterio.open(
              "data/fwi_forecast.tif"
          ) as src:

              print("================================")
              print("RASTER INFORMATION")
              print("================================")

              print(
                  "Width:",
                  src.width
              )

              print(
                  "Height:",
                  src.height
              )

              print(
                  "CRS:",
                  src.crs
              )

              print(
                  "NoData:",
                  src.nodata
              )


              band = src.read(
                  1
              ).astype(
                  "float64"
              )

              nodata = src.nodata


              for row in range(
                  src.height
              ):

                  for col in range(
                      src.width
                  ):

                      value = band[
                          row,
                          col
                      ]


                      if not np.isfinite(
                          value
                      ):
                          continue


                      if (
                          nodata is not None
                          and
                          math.isclose(
                              float(value),
                              float(nodata),
                              rel_tol=0,
                              abs_tol=1e-9
                          )
                      ):
                          continue


                      if value < 0:
                          continue


                      if value > 200:
                          continue


                      lon, lat = (
                          rasterio.transform.xy(
                              src.transform,
                              row,
                              col,
                              offset="center"
                          )
                      )


                      point = Point(
                          float(lon),
                          float(lat)
                      )


                      if not fars_geometry.contains(
                          point
                      ):
                          continue


                      points.append({

                          "lat":
                              round(
                                  float(lat),
                                  6
                              ),

                          "lon":
                              round(
                                  float(lon),
                                  6
                              ),

                          "fwi":
                              round(
                                  float(value),
                                  3
                              )
                      })


          # =========================================================
          # حذف نقاط تکراری
          # =========================================================

          unique = {}

          for point in points:

              key = (
                  point["lat"],
                  point["lon"]
              )

              unique[key] = point


          points = list(
              unique.values()
          )


          # =========================================================
          # اگر هیچ مقدار عددی نبود
          # =========================================================

          if not points:

              raise RuntimeError(
                  "No numeric FWI values were "
                  "found inside Fars."
              )


          # =========================================================
          # آمار
          # =========================================================

          values = [
              p["fwi"]
              for p in points
          ]


          minimum = min(
              values
          )

          maximum = max(
              values
          )

          mean = (
              sum(values)
              / len(values)
          )


          # =========================================================
          # طبقه‌بندی FWI
          # =========================================================

          def risk_class(value):

              if value < 11.2:
                  return "Low"

              if value < 21.3:
                  return "Moderate"

              if value < 38.0:
                  return "High"

              if value < 50.0:
                  return "Very High"

              if value <= 70.0:
                  return "Extreme"

              return "Very Extreme"


          for point in points:

              point["risk_class"] = (
                  risk_class(
                      point["fwi"]
                  )
              )


          # =========================================================
          # خروجی JSON
          # =========================================================

          output = {

              "forecast_gregorian":
                  target_date,

              "forecast_shamsi":
                  shamsi_date,

              "generated_at_iran":
                  now.strftime(
                      "%Y-%m-%d %H:%M"
                  ),

              "source":
                  "Copernicus EFFIS / ECMWF",

              "layer":
                  selected_layer,

              "region":
                  "Fars Province, Iran",

              "bbox": [
                  50.0,
                  27.0,
                  55.0,
                  32.0
              ],

              "statistics": {

                  "min":
                      round(
                          float(minimum),
                          3
                      ),

                  "max":
                      round(
                          float(maximum),
                          3
                      ),

                  "mean":
                      round(
                          float(mean),
                          3
                      ),

                  "count":
                      len(points)
              },

              "points":
                  points
          }


          with open(
              "data/fwi_fars.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # =========================================================
          # نتیجه
          # =========================================================

          print("================================")
          print("FWI FORECAST RESULT")
          print("================================")

          print(
              "Forecast:",
              target_date
          )

          print(
              "Shamsi:",
              shamsi_date
          )

          print(
              "Selected layer:",
              selected_layer
          )

          print(
              "Valid numeric points:",
              len(points)
          )

          print(
              "Minimum:",
              round(
                  minimum,
                  3
              )
          )

          print(
              "Maximum:",
              round(
                  maximum,
                  3
              )
          )

          print(
              "Mean:",
              round(
                  mean,
                  3
              )
          )

          print("================================")
          print(
              "Created: data/fwi_fars.json"
          )
          print("================================")

          PY

          python request_fwi.py


      - name: Show result
        run: |

          echo "================================"
          echo "FWI FARS JSON"
          echo "================================"

          python - <<'PY'
          import json

          with open(
              "data/fwi_fars.json",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          print(
              "Forecast:",
              data["forecast_gregorian"]
          )

          print(
              "Shamsi:",
              data["forecast_shamsi"]
          )

          print(
              "Layer:",
              data["layer"]
          )

          print(
              "Min:",
              data["statistics"]["min"]
          )

          print(
              "Max:",
              data["statistics"]["max"]
          )

          print(
              "Mean:",
              data["statistics"]["mean"]
          )

          print(
              "Points:",
              data["statistics"]["count"]
          )
          PY

          echo "================================"


      - name: Save FWI
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fwi_fars.json

          git add data/fwi_forecast.tif

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Update FWI forecast for tomorrow"

            git push

          fi
