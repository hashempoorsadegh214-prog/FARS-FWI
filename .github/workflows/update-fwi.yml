name: Update FWI Fars

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  update-fwi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install "cdsapi>=0.7.7" xarray cfgrib eccodes numpy geopandas shapely

      - name: Download FWI
        env:
          EWDS_API_KEY: ${{ secrets.EWDS_API_KEY }}
        run: |
          mkdir -p data

          cat > request_fwi.py <<'PY'
          import os
          import cdsapi

          client = cdsapi.Client(
              url="https://ewds.climate.copernicus.eu/api",
              key=os.environ["EWDS_API_KEY"]
          )

          request = {
              "product_type": "reanalysis",
              "variable": "fire_weather_index",
              "dataset_type": "consolidated_dataset",
              "system_version": "4_1",
              "year": "2025",
              "month": "08",
              "day": "20",
              "grid": "original_grid",
              "data_format": "grib",
              "area": [32, 50, 27, 55.8]
          }

          client.retrieve(
              "cems-fire-historical-v1",
              request,
              "data/fwi_fars.grib"
          )
          PY

          python request_fwi.py

      - name: Extract FWI for Fars
        run: |
          cat > extract_fwi.py <<'PY'
          import json
          import numpy as np
          import xarray as xr
          import geopandas as gpd
          from shapely.geometry import Point

          GRIB_FILE = "data/fwi_fars.grib"
          BOUNDARY_FILE = "fars.geojson"
          OUTPUT_FILE = "data/fwi_fars.json"

          print("Reading GRIB...")

          ds = xr.open_dataset(
              GRIB_FILE,
              engine="cfgrib",
              backend_kwargs={
                  "indexpath": ""
              }
          )

          print("Variables:", list(ds.data_vars))
          print("Dimensions:", dict(ds.sizes))
          print("Coordinates:", list(ds.coords))

          da = ds["fwinx"]

          values = np.asarray(da.values).squeeze()

          print("FWI shape:", values.shape)
          print("FWI dimensions:", da.dims)

          # ---------------------------------
          # حالت استاندارد شبکه‌ای
          # ---------------------------------

          if values.ndim == 2:

              latitudes = np.asarray(
                  ds["latitude"].values
              )

              longitudes = np.asarray(
                  ds["longitude"].values
              )

              fars = gpd.read_file(
                  BOUNDARY_FILE
              )

              if fars.crs is None:
                  fars = fars.set_crs(
                      "EPSG:4326"
                  )
              else:
                  fars = fars.to_crs(
                      "EPSG:4326"
                  )

              geometry = fars.geometry.union_all()

              points = []

              for i, lat in enumerate(latitudes):

                  for j, lon in enumerate(longitudes):

                      value = values[i, j]

                      if not np.isfinite(value):
                          continue

                      point = Point(
                          float(lon),
                          float(lat)
                      )

                      if geometry.contains(point):

                          points.append({
                              "lat": round(
                                  float(lat), 6
                              ),
                              "lon": round(
                                  float(lon), 6
                              ),
                              "fwi": round(
                                  float(value), 3
                              )
                          })

          # ---------------------------------
          # حالت فعلی فایل CEMS
          # FWI به صورت آرایه 339 تایی
          # ---------------------------------

          elif values.ndim == 1:

              print(
                  "FWI is a 1D list of grid cells."
              )

              # تلاش برای پیدا کردن مختصات
              if (
                  "latitude" in ds.variables
                  and
                  "longitude" in ds.variables
              ):

                  latitudes = np.asarray(
                      ds["latitude"].values
                  )

                  longitudes = np.asarray(
                      ds["longitude"].values
                  )

              else:

                  latitudes = None
                  longitudes = None

              points = []

              for i, value in enumerate(values):

                  if not np.isfinite(value):
                      continue

                  item = {
                      "index": i,
                      "fwi": round(
                          float(value), 3
                      )
                  }

                  if (
                      latitudes is not None
                      and
                      longitudes is not None
                      and
                      len(latitudes) == len(values)
                      and
                      len(longitudes) == len(values)
                  ):

                      item["lat"] = round(
                          float(latitudes[i]), 6
                      )

                      item["lon"] = round(
                          float(longitudes[i]), 6
                      )

                  points.append(item)

          else:

              raise RuntimeError(
                  f"Unsupported FWI shape: {values.shape}"
              )

          # ---------------------------------
          # خروجی
          # ---------------------------------

          output = {
              "date": "2025-08-20",
              "variable": "fwinx",
              "source":
                  "Copernicus CEMS Fire Weather Index",
              "region":
                  "Fars Province, Iran",
              "points": points
          }

          with open(
              OUTPUT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("================================")
          print("FWI FARS RESULT")
          print("================================")
          print(
              "Number of values:",
              len(points)
          )

          if points:

              fwi_values = [
                  p["fwi"]
                  for p in points
              ]

              print(
                  "Minimum FWI:",
                  min(fwi_values)
              )

              print(
                  "Maximum FWI:",
                  max(fwi_values)
              )

              print(
                  "Mean FWI:",
                  round(
                      sum(fwi_values)
                      / len(fwi_values),
                      3
                  )
              )

          print(
              "Output:",
              OUTPUT_FILE
          )

          print("================================")
          PY

          python extract_fwi.py

      - name: Show result
        run: |
          echo "========== FWI FARS =========="
          cat data/fwi_fars.json
          echo "=============================="

      - name: Save FWI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fwi_fars.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update FWI Fars"
            git push
          fi
