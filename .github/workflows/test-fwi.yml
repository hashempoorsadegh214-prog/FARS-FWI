name: Test FWI GetFeatureInfo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-fwi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          python -m pip install requests

      - name: Run GetFeatureInfo test
        run: |
          python test_getfeatureinfo.py
